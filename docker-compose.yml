services:
  postgres:
    image: postgres:16-alpine
    container_name: fisiosuite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fisiosuite
      POSTGRES_PASSWORD: fisiosuite
      POSTGRES_DB: fisiosuite
    ports:
      - "5433:5432"
    volumes:
      - fisiosuite_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisiosuite -d fisiosuite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fisiosuite_pg:
